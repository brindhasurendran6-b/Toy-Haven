<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description" content="Browse Toy Haven products.">
    <meta name="theme-color" content="#4B7BEC">

    <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="css/style.css">

    <title>Toy Haven | Shop</title>
</head>

<body data-page="products">

    <!--Header-->
    <header class="site-header">

        <a class="brand" href="index.html">TOY HAVEN</a>

        <!--Mobile menu button-->
        <button 
            class="menu-toggle" 
            aria-label="Open navigation" 
            aria-expanded="false">

            <span></span>
            <span></span>
            <span></span>
        </button>

        <!--Navigation-->
        <nav class="site-nav" aria-label="Main navigation">

            <a href="index.html">Home</a>

            <a class="active" href="products.html">Shop</a>

            <a href="wishlist.html">Collection</a>

            <a href="cart.html">
                Cart <span class="cart-count">0</span>
            </a>

            <a href="support.html">Help</a>

        </nav>

    </header>

    <!--Main content-->
    <main class="page-main">

        <!--Page introduction-->
        <div class="page-intro">

            <p class="eyebrow">THE HAVEN SHELF</p>

            <h1>Find something to play with</h1>

            <p>
                Search by name or choose a category.
                Select a product card to see more.
            </p>

        </div>

        <!--Search and category controls-->
        <div class="shop-controls">

            <!--Search-->
            <label class="search-box">

                <span>⌕</span>

                <input 
                    id="product-search"
                    type="search"
                    placeholder="Search products..."
                    aria-label="Search products">

            </label>

            <!--Category filters-->
            <div 
                id="category-filters"
                class="filters">
            </div>

        </div>

        <!--Product count-->
        <div class="section-heading compact">

            <h2>
                Products 
                <span id="product-count" class="count"></span>
            </h2>

        </div>

        <!--Product cards-->
        <div id="product-grid" class="product-grid"></div>

    </main>

    <!--Product details modal-->
    <div 
        id="product-modal"
        class="modal"
        aria-hidden="true">

        <div 
            class="modal-box"
            role="dialog"
            aria-modal="true"
            aria-labelledby="modal-title">

            <button 
                class="modal-close"
                aria-label="Close">×</button>

            <div id="modal-content"></div>

        </div>

    </div>

    <!--Toast message-->
    <div 
        id="toast"
        class="toast"
        role="status"
        aria-live="polite">
    </div>

    <!--Javascript-->
    <script src="js/products-data.js"></script>
    <script src="js/app.js"></script>

</body>

</html>
