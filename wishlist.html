<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description" content="Toy Haven collection and wishlist.">
    <meta name="theme-color" content="#4B7BEC">

    <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="css/style.css">

    <title>Toy Haven | Collection</title>
</head>

<body data-page="wishlist">

    <!--Header-->
    <header class="site-header">

        <a class="brand" href="index.html">TOY HAVEN</a>

        <!--Mobile menu button-->
        <button 
            class="menu-toggle" 
            aria-label="Open navigation" 
            aria-expanded="false">

            <span></span>
            <span></span>
            <span></span>
        </button>

        <!--Navigation-->
        <nav class="site-nav" aria-label="Main navigation">

            <a href="index.html">Home</a>

            <a href="products.html">Shop</a>

            <a class="active" href="wishlist.html">Collection</a>

            <a href="cart.html">
                Cart <span class="cart-count">0</span>
            </a>

            <a href="support.html">Help</a>

        </nav>

    </header>

    <!--Main content-->
    <main class="page-main">

        <!--Page introduction-->
        <div class="page-intro">

            <p class="eyebrow">MY COLLECTION</p>

            <h1>Keep track of your favourites</h1>

            <p>
                Save a product, then mark it Interested, Owned or Not Interested.
            </p>

        </div>

        <!--Wishlist/ Collection products-->
        <div 
        id="wishlist-list" 
        class="collection-grid"></div>

    </main>

    <!--Toast message-->
    <div 
        id="toast" 
        class="toast" 
        role="status" 
        aria-live="polite">
    </div>

    <!--JavaScript-->
    <script src="js/products-data.js"></script>
    <script src="js/app.js"></script>

</body>

</html>
