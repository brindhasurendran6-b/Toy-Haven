<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description" content="Toy Haven checkout.">
    <meta name="theme-color" content="#4B7BEC">

    <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="css/style.css">

    <title>Toy Haven | Checkout</title>
</head>

<body data-page="checkout">

    <!--Header-->
    <header class="site-header">

        <a class="brand" href="index.html">TOY HAVEN</a>

        <!--Mobile menu button-->
        <button 
            class="menu-toggle" 
            aria-label="Open navigation" 
            aria-expanded="false">

            <span></span>
            <span></span>
            <span></span>
        </button>

        <!--Navigation-->
        <nav class="site-nav" aria-label="Main navigation">

            <a href="index.html">Home</a>

            <a href="products.html">Shop</a>

            <a href="wishlist.html">Collection</a>

            <a href="cart.html">
                Cart <span class="cart-count">0</span>
            </a>

            <a href="support.html">Help</a>

        </nav>

    </header>

    <!--Main content-->
    <main class="page-main">

        <!--Page introduction-->
        <div class="page-intro">

            <p class="eyebrow">CHECKOUT</p>

            <h1>Finish your order</h1>

            <p>
                Simple checkout with front-end validation.
            </p>

        </div>

        <!--Checkout area-->
        <div class="checkout-layout">

            <!--Checkout form-->
            <form 
                id="checkout-form"
                class="form-card"
                novalidate>

                <h2>Delivery details</h2>

                <!--Full name-->
                <label>
                    Full Name

                    <input 
                        id="checkout-name"
                        name="name"
                        type="text"
                        required>

                </label>

                <!--Email-->
                <label>
                    Email

                    <input 
                        id="checkout-email"
                        name="email"
                        type="email"
                        required>

                </label>

                <!--Address-->
                <label>
                    Delivery Address

                    <textarea 
                        id="checkout-address"
                        name="address"
                        rows="4"
                        required>
                    </textarea>
                </label>

                <!--Payment method-->
                <fieldset>

                    <legend>Payment method</legend>

                    <label class="radio">
                        <input 
                            type="radio"
                            name="payment"
                            value="Card"
                            checked>

                        Card (simulation)
                    </label>

                    <label class="radio">
                        <input 
                            type="radio"
                            name="payment"
                            value="Cash on Delivery">

                        Cash on Delivery
                    </label>

                </fieldset>

                <!--Validation message-->
                <div 
                    id="checkout-message"
                    class="form-message">
                </div>

                <!--Submit button-->
                <button class="btn" type="submit">PLACE ORDER</button>

            </form>

            <!--Order summary-->
            <aside 
                id="checkout-summary"
                class="summary-card">
            </aside>

        </div>

    </main>

    <!--Order success message-->
    <div 
        id="success-box"
        class="success-box"
        aria-hidden="true">
    </div>

    <!--Toast message-->
    <div 
        id="toast"
        class="toast"
        role="status"
        aria-live="polite">
    </div>

    <!--JavaScript-->
    <script src="js/products-data.js"></script>
    <script src="js/app.js"></script>

</body>

</html>
